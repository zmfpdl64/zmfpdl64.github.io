{{ $data := .Site.Data.portfolio }}
<section class="portfolio-section">
  <h2>🏆 자격증</h2>
  <p class="cert-hint">클릭하여 자격증 확인</p>
  <div class="cert-grid">
    {{ range $data.certifications }}
    <div
      class="cert-card clickable"
      onclick="openPdfViewer('{{ .pdf }}', '{{ .title }}')"
    >
      <span class="cert-icon">{{ .icon }}</span>
      <div class="cert-info">
        <h4>{{ .title }}</h4>
        <p>{{ .description }}</p>
      </div>
    </div>
    {{ end }}
  </div>
</section>
