{{ $data := .Site.Data.portfolio }}
<section class="portfolio-section">
  <h2>🛠️ Tech Stack</h2>
  <div class="tech-grid">
    {{ range $data.tech_stack }}
    <div class="tech-category">
      <h3>{{ .category }}</h3>
      <div class="tech-tags">
        {{ range .tags }}
        <span class="tech-tag {{ .class }}">{{ .name }}</span>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</section>
