baseURL = 'https://zmfpdl64.github.io/'
languageCode = 'ko-kr'
title = 'Lee WooJin | Developer'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  author = "Lee WooJin"
  description = "꾸준히 성장하는 개발자 이우진의 기술 블로그입니다."
  # Analytics API 엔드포인트 (배포 후 실제 URL로 변경)
  analyticsEndpoint = "https://your-api-server.com/events"

  [params.assets]
    disableFingerprinting = true
  keywords = ["개발자", "프로그래밍", "Tech", "Portfolio", "Blog"]
  defaultTheme = "light"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true

  [params.homeInfoParams]
    Title = "👋 안녕하세요!"
    Content = """
**꾸준히 성장하는 개발자 이우진입니다.**

새로운 기술을 배우고, 문제를 해결하며, 더 나은 코드를 작성하기 위해 노력합니다.  
이 블로그에서는 개발 경험, 기술 학습, 프로젝트를 공유합니다.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/zmfpdl64"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:your-email@example.com"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    identifier = "portfolio"
    name = "Portfolio"
    url = "/portfolio/"
    weight = 4
  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "/archives/"
    weight = 5
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 6
  [[menu.main]]
    identifier = "adsp"
    name = "ADSP"
    url = "/adsp/"
    weight = 7
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    tabWidth = 4
